# H2 In-Memory Database Configuration for Tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (optional, for debugging tests)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate settings for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT Configuration for Tests
app.jwt.secret=test-secret-key-for-testing-purposes-only
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# Social Login Configuration for Tests
app.social.google.client-id=test-google-client-id
app.social.google.redirect-uri=http://localhost:3000/auth/callback

# PayPal Configuration for Tests
paypal.client-id=test-paypal-client-id
paypal.client-secret=test-paypal-client-secret
paypal.base-url=https://api-m.sandbox.paypal.com
