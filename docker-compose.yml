services:
  postgres:
    image: postgres:16
    container_name: event-booking-postgres
    environment:
      POSTGRES_DB: event_booking
      POSTGRES_USER: event_user
      POSTGRES_PASSWORD: event_password
    ports:
      - "5433:5432"
    volumes:
      - event_booking_data:/var/lib/postgresql/data
volumes:
  event_booking_data:


