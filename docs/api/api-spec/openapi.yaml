openapi: 3.0.3

info:
  title: Event Booking Platform API
  version: 0.1.0
  description: >
    API contract for a Spring Boot event booking backend.
    Covers event browsing, seat availability, seat reservation, payment and
    booking confirmation.
    This document is kept in sync with the @RestController classes under
    backend/src/main/java and with SecurityConfig.

    Authorization model: every /api/reservations, /api/payments and /api/bookings
    path requires a bearer token. GET /api/reservations and GET /api/bookings
    additionally require the ADMIN role, because they return every record in the
    system; a CUSTOMER reads only their own data through /api/bookings/customer/me,
    /api/bookings/{bookingId} and /api/bookings/ticket/{ticketCode}. /api/auth/**
    except /api/auth/me, /health and the event read endpoints are public, and
    anything else is denied.
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Health
    description: Service liveness
  - name: Auth
    description: Authentication and authorization APIs
  - name: Events
    description: Event browsing APIs
  - name: Seats
    description: Event seat availability APIs
  - name: Reservations
    description: Seat reservation APIs
  - name: Payments
    description: Payment order APIs
  - name: Bookings
    description: Booking confirmation APIs

paths:
  /health:
    $ref: "./paths/health.yaml#/health"

  /api/auth/register:
    $ref: "./paths/auth.yaml#/register"

  /api/auth/login:
    $ref: "./paths/auth.yaml#/login"

  /api/auth/social:
    $ref: "./paths/auth.yaml#/socialLogin"

  /api/auth/refresh:
    $ref: "./paths/auth.yaml#/refreshAccessToken"

  /api/auth/me:
    $ref: "./paths/auth.yaml#/getCurrentUser"

  /api/auth/logout:
    $ref: "./paths/auth.yaml#/logout"

  /api/events:
    $ref: "./paths/events.yaml#/events"

  /api/events/{eventId}:
    $ref: "./paths/events.yaml#/eventById"

  /api/events/{eventId}/seats:
    $ref: "./paths/seats.yaml#/eventSeats"

  /api/reservations:
    $ref: "./paths/reservations.yaml#/reservations"

  /api/reservations/{reservationId}:
    $ref: "./paths/reservations.yaml#/reservationById"

  /api/payments/orders:
    $ref: "./paths/payments.yaml#/paymentOrders"

  /api/payments/{paymentId}/capture:
    $ref: "./paths/payments.yaml#/capturePayment"

  /api/bookings:
    $ref: "./paths/bookings.yaml#/bookings"

  /api/bookings/{bookingId}:
    $ref: "./paths/bookings.yaml#/bookingById"

  /api/bookings/customer/me:
    $ref: "./paths/bookings.yaml#/customerBookings"

  /api/bookings/ticket/{ticketCode}:
    $ref: "./paths/bookings.yaml#/ticketByCode"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security: []
