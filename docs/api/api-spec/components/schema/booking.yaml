CreateBookingRequest:
  type: object
  required:
    - reservationId
  properties:
    reservationId:
      type: integer
      format: int64
      example: 5001
    paymentMethod:
      type: string
      description: >
        Free-form label echoed back on the booking details. The payment method is
        actually read from the linked payment, not from this field.
      example: PAYPAL

BookingResponse:
  type: object
  required:
    - bookingId
    - reservationId
    - status
    - ticketCode
  properties:
    bookingId:
      type: integer
      format: int64
      example: 9001
    reservationId:
      type: integer
      format: int64
      example: 5001
    status:
      type: string
      enum:
        - PENDING
        - CONFIRMED
        - CANCELLED
        - FAILED
      example: CONFIRMED
    ticketCode:
      type: string
      pattern: "^TCK[0-9]{8}[A-Z0-9]{6}$"
      example: TCK20260920A1B2C3

BookingDetailsDto:
  type: object
  required:
    - id
    - bookingReference
    - status
    - totalAmount
    - createdAt
    - paymentMethod
    - reservation
  properties:
    id:
      type: integer
      format: int64
      example: 9001
    bookingReference:
      type: string
      description: Same value as the ticket code.
      example: TCK20260920A1B2C3
    status:
      type: string
      enum:
        - PENDING
        - CONFIRMED
        - CANCELLED
        - FAILED
      example: CONFIRMED
    totalAmount:
      type: number
      description: Sum of all reserved seat prices.
      example: 99.98
    createdAt:
      type: string
      format: date-time
      example: "2026-09-20T18:00:00Z"
    paymentMethod:
      type: string
      description: Name of the linked payment provider.
      example: PAYPAL
    reservation:
      $ref: "./reservation.yaml#/ReservationSummaryResponse"

CustomerBookingEventSummary:
  type: object
  required:
    - title
    - imageUrl
    - venue
    - city
    - startDate
  properties:
    title:
      type: string
      example: Rock Concert Berlin
    imageUrl:
      type: string
      format: uri
      example: https://picsum.photos/seed/event-1/480/270
    venue:
      type: string
      example: Berlin Arena
    city:
      type: string
      example: Berlin
    startDate:
      type: string
      format: date-time
      example: "2026-09-20T19:00:00Z"

CustomerBookingSeatInfo:
  type: object
  required:
    - section
    - rowLabel
    - seatNumber
  properties:
    section:
      type: string
      example: A
    rowLabel:
      type: string
      example: "1"
    seatNumber:
      type: string
      example: "12"

CustomerBookingDto:
  type: object
  required:
    - id
    - bookingReference
    - status
    - totalAmount
    - createdAt
    - event
    - seat
  properties:
    id:
      type: integer
      format: int64
      example: 9001
    bookingReference:
      type: string
      example: TCK20260920A1B2C3
    status:
      type: string
      enum:
        - PENDING
        - CONFIRMED
        - CANCELLED
        - FAILED
      example: CONFIRMED
    totalAmount:
      type: number
      example: 99.98
    createdAt:
      type: string
      format: date-time
      example: "2026-09-20T18:00:00Z"
    event:
      $ref: "#/CustomerBookingEventSummary"
    seat:
      allOf:
        - $ref: "#/CustomerBookingSeatInfo"
      description: First seat of the reservation only.
