CreateReservationRequest:
  type: object
  required:
    - seatIds
  properties:
    seatIds:
      type: array
      minItems: 1
      description: >
        Seat ids to hold. All seats must belong to the same event, otherwise the
        request is rejected with SEATS_SPAN_MULTIPLE_EVENTS and no seat is held.
      items:
        type: integer
        format: int64
      example: [1001, 1002]

ReservationResponse:
  type: object
  required:
    - reservationId
    - eventSeatId
    - customerId
    - reservationStatus
    - expiresAt
  properties:
    reservationId:
      type: integer
      format: int64
      example: 5001
    eventSeatId:
      type: integer
      format: int64
      description: >
        First seat of the reservation only. The service intentionally returns a
        single seat for backward compatibility.
      example: 1001
    customerId:
      type: integer
      format: int64
      example: 1
    reservationStatus:
      type: string
      enum:
        - ACTIVE
        - CANCELLED
        - EXPIRED
        - CONFIRMED
      example: ACTIVE
    expiresAt:
      type: string
      format: date-time
      description: Seats are held for 10 minutes from creation.
      example: "2026-09-20T18:05:00Z"

ReservationEventInfo:
  type: object
  required:
    - id
    - title
    - imageUrl
    - venue
    - city
    - startDate
  properties:
    id:
      type: integer
      format: int64
      example: 1
    title:
      type: string
      example: Rock Concert Berlin
    imageUrl:
      type: string
      format: uri
      example: https://picsum.photos/seed/event-1/480/270
    venue:
      type: string
      example: Berlin Arena
    city:
      type: string
      example: Berlin
    startDate:
      type: string
      format: date-time
      example: "2026-09-20T19:00:00Z"

ReservationSeatInfo:
  type: object
  required:
    - id
    - section
    - rowLabel
    - seatNumber
    - price
  properties:
    id:
      type: integer
      format: int64
      example: 1001
    section:
      type: string
      example: A
    rowLabel:
      type: string
      example: "1"
    seatNumber:
      type: string
      example: "12"
    price:
      type: number
      example: 49.99

ReservationSummaryResponse:
  type: object
  required:
    - id
    - eventId
    - status
    - expiresAt
    - event
    - selectedSeats
  properties:
    id:
      type: integer
      format: int64
      example: 5001
    eventId:
      type: integer
      format: int64
      example: 1
    status:
      type: string
      enum:
        - ACTIVE
        - CANCELLED
        - EXPIRED
        - CONFIRMED
      example: ACTIVE
    expiresAt:
      type: string
      format: date-time
      example: "2026-09-20T18:05:00Z"
    event:
      $ref: "#/ReservationEventInfo"
    selectedSeats:
      type: array
      items:
        $ref: "#/ReservationSeatInfo"
