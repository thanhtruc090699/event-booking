bookings:
  get:
    tags:
      - Bookings
    summary: List all bookings
    operationId: getAllBookings
    security:
      - bearerAuth: []
    description: >
      Admin only. Returns every booking across all customers. A signed-in CUSTOMER
      receives 403. A CUSTOMER reads their own bookings through
      /api/bookings/customer/me instead.
    responses:
      "200":
        description: All bookings
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schema/booking.yaml#/BookingResponse"
      "401":
        description: Missing or invalid access token
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"
      "403":
        description: Authenticated but the role is not ADMIN
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"

  post:
    tags:
      - Bookings
    summary: Confirm a booking from a paid reservation
    operationId: createBooking
    security:
      - bearerAuth: []
    description: >
      The linked payment must already be COMPLETED. On success the reservation is
      marked CONFIRMED and its seats become BOOKED.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schema/booking.yaml#/CreateBookingRequest"
    responses:
      "201":
        description: Booking confirmed
        content:
          application/json:
            schema:
              $ref: "../components/schema/booking.yaml#/BookingDetailsDto"
      "400":
        description: Validation failed
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"
      "401":
        description: Missing or invalid access token
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"
      "403":
        description: Reservation belongs to another customer
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"
            example:
              code: RESERVATION_ACCESS_DENIED
              message: You are not allowed to book this reservation
      "404":
        description: Reservation not found
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"
      "409":
        description: >
          Reservation missing, no payment, payment not completed, payment linked
          to a different reservation, or reservation expired or not active.
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"
            examples:
              reservationMissing:
                value:
                  code: RESERVATION_NOT_FOUND
                  message: Reservation not found
              paymentNotCompleted:
                value:
                  code: PAYMENT_NOT_COMPLETED
                  message: Payment has not been completed
              reservationExpired:
                value:
                  code: RESERVATION_EXPIRED
                  message: Reservation is expired

bookingById:
  get:
    tags:
      - Bookings
    summary: Get a booking by its id
    operationId: getBookingById
    security:
      - bearerAuth: []
    parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 9001
    responses:
      "200":
        description: Booking detail
        content:
          application/json:
            schema:
              $ref: "../components/schema/booking.yaml#/BookingDetailsDto"
      "401":
        description: Missing or invalid access token
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"
      "403":
        description: Booking belongs to another customer
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"
            example:
              code: BOOKING_ACCESS_DENIED
              message: You are not allowed to view this booking
      "404":
        description: Booking not found
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"
            example:
              code: BOOKING_NOT_FOUND
              message: Booking not found
      "409":
        description: No payment linked to the booking
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"
            example:
              code: PAYMENT_NOT_FOUND
              message: Payment not found

customerBookings:
  get:
    tags:
      - Bookings
    summary: List the current customer's bookings
    operationId: getMyBookings
    security:
      - bearerAuth: []
    description: Newest first, ordered by booking creation time descending.
    responses:
      "200":
        description: Bookings owned by the current customer
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schema/booking.yaml#/CustomerBookingDto"
      "401":
        description: Missing or invalid access token
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"
      "404":
        description: Customer not found
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"

ticketByCode:
  get:
    tags:
      - Bookings
    summary: Get a booking by its ticket code
    operationId: getTicketByCode
    security:
      - bearerAuth: []
    description: >
      Accepts either the TCK... ticket code or a legacy numeric booking id.
    parameters:
      - name: ticketCode
        in: path
        required: true
        schema:
          type: string
        example: TCK20260920A1B2C3
    responses:
      "200":
        description: Ticket detail
        content:
          application/json:
            schema:
              $ref: "../components/schema/booking.yaml#/CustomerBookingDto"
      "401":
        description: Missing or invalid access token
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"
      "403":
        description: Ticket belongs to another customer
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"
            example:
              code: TICKET_ACCESS_DENIED
              message: You are not allowed to view this ticket
      "404":
        description: Ticket not found
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"
            example:
              code: BOOKING_NOT_FOUND
              message: Ticket not found
