bookings:
  get:
    tags:
      - Bookings
    summary: Get all the bookings
    operationId: getBookings
    responses:
      "200":
        description: All successful bookings
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schema/booking.yaml#/BookingResponse"
  post:
    tags:
      - Bookings
    summary: Confirm booking from reservation
    security:
      - bearerAuth: []
    operationId: createBooking
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schema/booking.yaml#/CreateBookingRequest"
    responses:
      "201":
        description: Booking confirmed
        content:
          application/json:
            schema:
              $ref: "../components/schema/booking.yaml#/BookingResponse"
      "409":
        description: Reservation cannot be confirmed
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"
      "400":
        description: Invalid booking request
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"
      "404":
        description: Reservation not found
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"
bookingById:
  get:
    tags:
      - Booking
    summary: get detailed booking by its id
    operationId: getBookingById
    parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    responses:
      "200":
        description: get booking by its id
        content:
          application/json:
            schema:
              $ref: "../components/schema/booking.yaml#/BookingResponse"
      "404":
        description: Booking not found
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"