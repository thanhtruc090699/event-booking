events:
  get:
    tags:
      - Events
    summary: List all events
    operationId: getEvents
    description: >
      Returns every event, including past ones. There is currently no filtering
      or pagination, and no published/draft state on the event.
    responses:
      "200":
        description: All events
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schema/event.yaml#/EventSummaryResponse"

eventById:
  get:
    tags:
      - Events
    summary: Get event detail
    operationId: getEventById
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    responses:
      "200":
        description: Event detail
        content:
          application/json:
            schema:
              $ref: "../components/schema/event.yaml#/EventDetailResponse"
      "404":
        description: Event not found
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"
            example:
              code: EVENT_NOT_FOUND
              message: Event not found
