eventSeats:
  get:
    tags:
      - Seats
    summary: Get all seats of an event
    operationId: getEventSeats
    description: >
      Returns every seat with its live status. There is no filter for
      availability only.
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    responses:
      "200":
        description: Event seats
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schema/seat.yaml#/EventSeatResponse"
      "400":
        description: eventId is not a number
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"
