register:
  post:
    tags:
      - Auth
    summary: Register an account
    operationId: register
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schema/auth.yaml#/RegisterRequest"
    responses:
      "201":
        description: Successfully Register
        content:
          application/json:
            schema:
              $ref: "../components/schema/auth.yaml#/RegisterResponse"
      "400":
        description: Invalid Register Request
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"
      "409":
        description: Email already exists
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"

login:
  post:
    tags:
      - Auth
    summary: Log in
    operationId: LogIn
    requestBody:
      content:
        application/json:
          schema:
            $ref: "../components/schema/auth.yaml#/LoginRequest"
    responses:
      "200":
        description: Successfully log in
        content:
          application/jon:
            schema:
              $ref: "../components/schema/auth.yaml#/LoginResponse"
      "400":
        description: Invalid Login Request
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"

