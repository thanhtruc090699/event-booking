reservations:
  post:
    tags:
      - Reservations
    summary: Create a seat reservation
    operationId: createReservation
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schema/reservation.yaml#/CreateReservationRequest"
    responses:
      "201":
        description: Reservation created
        content:
          application/json:
            schema:
              $ref: "../components/schema/reservation.yaml#/ReservationResponse"
      "409":
        description: Seat is not available
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"
      "404":
        description: Seat not found
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"
      "400":
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: "../components/schema/error.yaml#/ErrorResponse"
